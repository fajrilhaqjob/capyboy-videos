name: Antrekan ke Buffer

on:
  schedule:
    - cron: "0 23 * * *"   # setiap hari 06.00 WIB
  workflow_dispatch:
  push:
    paths:
      - "videos/**"
      - "schedule/schedule.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: buffer-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Jadwalkan video ke Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/queue_buffer.py
      - name: Simpan status antrean
        run: |
          git config user.name "capyboy-bot"
          git config user.email "capyboy-bot@users.noreply.github.com"
          git add schedule/state.json
          git diff --staged --quiet || (git commit -m "Update status antrean Buffer" && git push)
